# ci.yml -- Trust-core CI untuk myc (MYC-AUDIT-023, roadmap Fase 8).
#
# Dua job paralel:
#   - windows: build.bat (MSYS2 gcc) + test\_regress_run.bat (cmd, trust-core
#     penuh: fixtures, self-dogfooding, audit018, MCP smoke, dogfood).
#   - linux:   build.sh (gcc) + test/_ci_linux.sh (trust-core POSIX: fixtures,
#     self-dogfooding, audit018 dengan verify_descendants fork-test).
#
# Backend opsional (Frama-C --prove, Fil-C --filc) TIDAK diinstall di CI —
# fixture terkait menampilkan UNAVAILABLE/INCONCLUSIVE (non-blocking sesuai
# MYC-AUDIT-004/9.10), bukan FAIL. Backend WAJIB: gcc + clang (gate run).
#
# Catatan image windows-latest (per runner-images README): MSYS2 (mingw64
# gcc 15.2.0) di C:\msys64 TAPI tidak di-PATH; LLVM 20.1.8 di
# C:\Program Files\LLVM; Git for Windows bash preinstalled.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    name: Windows (build.bat + _regress_run.bat)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whitespace / CRLF issues
        run: git diff --check

      - name: Setup toolchain PATH (MSYS2 gcc + LLVM clang + git bash)
        shell: bash
        run: |
          for d in "/c/msys64/mingw64/bin" "/c/ProgramData/mingw64/mingw64/bin" "/c/mingw64/bin"; do
            if [ -x "$d/gcc.exe" ]; then
              cygpath -w "$d" >> "$GITHUB_PATH"
              echo "gcc dir: $d"
              break
            fi
          done
          if [ -x "/c/Program Files/LLVM/bin/clang.exe" ]; then
            cygpath -w "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::LLVM clang tidak ditemukan; gate --run akan jadi UNAVAILABLE"
          fi
          # clang ASan runtime DLL (libclang_rt.asan_dynamic-*.dll) harus ada di
          # PATH agar gate --run bisa dieksekusi di Windows runner; bila absen,
          # binary verifikasi gagal launch dan guard anti-false-OK ikut gagal.
          ASAN_LIB=$(ls -d "/c/Program Files/LLVM/lib/clang"/*/lib/windows 2>/dev/null | head -1)
          if [ -n "$ASAN_LIB" ]; then
            cygpath -w "$ASAN_LIB" >> "$GITHUB_PATH"
            echo "asan lib dir: $ASAN_LIB"
          else
            echo "::warning::clang ASan runtime DLL tidak ditemukan; gate --run mungkin gagal launch"
          fi
          cygpath -w "/c/Program Files/Git/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          gcc --version | head -1 || { echo "::error::gcc tidak ditemukan di PATH"; exit 1; }
          clang --version | head -1 || { echo "::error::clang tidak ditemukan di PATH"; exit 1; }

      - name: Compile -Werror check (all source files)
        shell: bash
        run: |
          set -e
          echo "--- Compile each .c with -Werror (gcc) ---"
          for f in myc.c proc.c scanner.c policy.c compile.c report.c sha256.c lint.c run.c contract.c state.c abi.c resource.c units.c profile.c eig.c candidate.c prove.c filc.c driver.c json.c gate.c negative.c agent.c witness.c ledger.c transaction.c frontier.c observation.c causal.c nextbest.c cache.c context.c budget.c assume.c taxonomy.c prompt.c stack.c mutate.c scenario.c matrix.c mcp.c; do
            echo "=== $f ==="
            gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Werror=implicit-function-declaration -c "$f" -o "/tmp/${f%.c}.o" 2>&1
          done
          echo "--- All source files compiled clean with -Werror ---"

      - name: Build (build.bat)
        shell: cmd
        run: build.bat

      - name: Trust-core regression (_regress_run.bat)
        shell: cmd
        run: test\_regress_run.bat

  linux:
    name: Linux (build.sh + _ci_linux.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whitespace / CRLF issues
        run: git diff --check

      - name: Install clang (gcc sudah preinstalled di ubuntu-latest)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Compile -Werror check (all source files)
        run: |
          set -e
          echo "--- Compile each .c with -Werror (gcc) ---"
          for f in myc.c proc.c scanner.c policy.c compile.c report.c sha256.c lint.c run.c contract.c state.c abi.c resource.c units.c profile.c eig.c candidate.c prove.c filc.c driver.c json.c gate.c negative.c agent.c witness.c ledger.c transaction.c frontier.c observation.c causal.c nextbest.c cache.c context.c budget.c assume.c taxonomy.c prompt.c stack.c mutate.c scenario.c matrix.c mcp.c; do
            echo "=== $f ==="
            gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Werror=implicit-function-declaration -c "$f" -o "/tmp/${f%.c}.o" 2>&1
          done
          echo "--- All source files compiled clean with -Werror ---"

      - name: Build + trust-core POSIX
        run: bash test/_ci_linux.sh

      # Fase 5 gates smoke test (A3/A4/C2/D1/B5/C1/C3/C5/C4) -- regresi
      # eksplisit per gate baru; pola identik dengan blok 5g-5p di
      # test/_ci_linux.sh (yang juga dijalankan step di atas).
      - name: Fase 5 gates smoke (exhaustive/compare/stack/fuzz/mutate/freestanding/scenario/matrix)
        run: |
          set -e
          echo "--- A3 exhaustive ---"
          ./myc check test/fixtures/ok_exhaustive.c --exhaustive --no-cache 2>&1 | grep -qF "P1 EXHAUSTIVE untuk domain dideklarasikan"
          echo "--- A4 compare ---"
          ./myc compare test/fixtures/ref_crc16.c test/fixtures/new_crc16_div.c 2>&1 | grep -qF "53 divergen"
          ./myc compare test/fixtures/ref_crc16.c test/fixtures/new_crc16_same.c 2>&1 | grep -qF "behavior-preserving"
          echo "--- C2 stack ---"
          ./myc check tests/ok_hello.c --stack --no-cache 2>&1 | grep -qF "worst path : main = "
          ./myc check test/fixtures/stack_recursive.c --stack --no-cache 2>&1 | grep -qF "recursion  : cycle di call graph"
          echo "--- D1 fuzz ---"
          ./myc check test/fixtures/ok_fuzz.c --fuzz --fuzz-iters 2000 --no-cache 2>&1 | grep -qF "fuzz (D1): 1 fungsi, 2000 kasus tereksekusi"
          echo "--- B5 mutate-audit ---"
          ./myc check test/fixtures/mutate_target.c --mutate-audit --mutate-max 6 --no-cache 2>&1 | grep -qF "3 tertangkap, 0 GAP"
          echo "--- C1 freestanding ---"
          ./myc check test/fixtures/blinky_bad.c --freestanding --no-cache 2>&1 | grep -qF "printf() dipanggil -- API hosted"
          ./myc check test/fixtures/blinky_clean.c --freestanding --no-cache 2>&1 | grep -qF "0 panggilan API hosted"
          echo "--- C3 bare-metal (MMIO/volatile traps) ---"
          ./myc check test/fixtures/mmio_bad.c --freestanding --no-cache 2>&1 | grep -qF "MMIO deref alamat absolut tanpa volatile"
          echo "--- C5 scenario packs ---"
          ./myc check test/fixtures/scen_parser.c --scenario auto --no-cache 2>&1 | grep -qF "scenario (C5): library"
          ./myc check tests/ok_hello.c --scenario firmware --no-cache 2>&1 | grep -qF "scenario (C5): firmware"
          echo "--- C4 target matrix ---"
          ./myc check tests/ok_hello.c --matrix --no-cache 2>&1 | grep -qF "matrix (C4):"
          echo "--- Fase 5 gates: SEMUA PASS ---"
