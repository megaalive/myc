name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: myc-linux
            binary_name: myc
          - os: windows-latest
            artifact_name: myc-windows
            binary_name: myc.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for d in "/c/msys64/mingw64/bin" "/c/ProgramData/mingw64/mingw64/bin" "/c/mingw64/bin"; do
            if [ -x "$d/gcc.exe" ]; then
              cygpath -w "$d" >> "$GITHUB_PATH"
              echo "gcc dir: $d"
              break
            fi
          done
          if [ -x "/c/Program Files/LLVM/bin/clang.exe" ]; then
            cygpath -w "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          fi
          ASAN_LIB=$(ls -d "/c/Program Files/LLVM/lib/clang"/*/lib/windows 2>/dev/null | head -1)
          if [ -n "$ASAN_LIB" ]; then
            cygpath -w "$ASAN_LIB" >> "$GITHUB_PATH"
          fi
          cygpath -w "/c/Program Files/Git/bin" >> "$GITHUB_PATH"

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build (POSIX)
        if: runner.os == 'Linux'
        env:
          MYC_GIT_SHA: ${{ github.sha }}
        run: bash build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MYC_GIT_SHA: ${{ github.sha }}
        run: build.bat

      - name: Upload Linux binaries
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            myc
            mcp
            argv_probe

      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            myc.exe
            mcp.exe
            argv_probe.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/myc-linux/myc dist/myc
          cp artifacts/myc-linux/mcp dist/mcp
          cp artifacts/myc-linux/argv_probe dist/argv_probe
          cp artifacts/myc-windows/myc.exe dist/myc.exe
          cp artifacts/myc-windows/mcp.exe dist/mcp.exe
          cp artifacts/myc-windows/argv_probe.exe dist/argv_probe.exe
          ( cd dist && sha256sum myc mcp argv_probe myc.exe mcp.exe argv_probe.exe > SHA256SUMS )
          {
            echo "Release ${{ github.ref_name }}"
            echo
            echo "Source commit: \`${{ github.sha }}\`"
            echo
            echo "Binaries: Linux \`myc\` \`mcp\` \`argv_probe\`; Windows \`myc.exe\` \`mcp.exe\` \`argv_probe.exe\`."
            echo "Checksums: \`SHA256SUMS\` attached."
            echo "Stamp: \`myc version\` prints \`git: ${{ github.sha }}\`."
            echo
            echo "Rebuild: checkout this tag; Linux \`MYC_GIT_SHA=${{ github.sha }} bash build.sh\`, Windows \`set MYC_GIT_SHA=${{ github.sha }}\` then \`build.bat\`, gcc matching CI."
            echo "Bit-identical binaries are **not** claimed (toolchain patch, timestamps)."
            echo "Provenance = git SHA of the tag + SHA256 of the uploaded artifacts."
            echo
            echo "See \`docs/release.md\`."
          } > notes.md
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            dist/myc dist/mcp dist/argv_probe \
            dist/myc.exe dist/mcp.exe dist/argv_probe.exe \
            dist/SHA256SUMS
